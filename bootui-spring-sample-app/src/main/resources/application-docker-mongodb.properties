# Only Mongo runs in Docker. H2 keeps JPA, Flyway and Liquibase and their pending demo work.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose-mongodb.yaml
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:bootui_mongodb_sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m,recordStats

spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration,\
  org.springframework.boot.kafka.autoconfigure.metrics.KafkaMetricsAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration

# These are disposable fixture credentials, not the Compose administrator credentials.
sample.mongodb.username=${BOOTUI_SAMPLE_MONGODB_USERNAME:bootui}
sample.mongodb.password=${BOOTUI_SAMPLE_MONGODB_PASSWORD:bootui-demo}
spring.mongodb.database=bootui_sample
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.repositories.type=none
bootui.mongodb.clients.sampleMongoClient.databases=bootui_sample
bootui.mongodb.authorized-database-enumeration-enabled=false
# Readiness is checked by Compose. Do not make a Mongo diagnostic request on the health page.
management.health.mongo.enabled=false
logging.level.org.mongodb.driver.client=WARN
