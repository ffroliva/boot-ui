# Requires Maven -Pmongodb-diagnostics and an explicitly provisioned, non-root local fixture URL.
# H2 is still the relational sample datasource; no Mongo Dev Services or synchronous Mongo driver.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:bootui_webflux_sample;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.cache.type=simple
spring.mongodb.uri=${BOOTUI_SAMPLE_MONGODB_URL}
spring.mongodb.database=bootui_sample
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.repositories.type=none
bootui.enabled-profiles=dev,local,mongodb-diagnostics
bootui.mongodb.clients.reactiveStreamsMongoClient.databases=bootui_sample
bootui.mongodb.authorized-database-enumeration-enabled=false
management.health.mongo.enabled=false
logging.level.org.mongodb.driver.client=WARN
