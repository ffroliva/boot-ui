# Opt-in local fixture only: -Pmongodb-diagnostics -Dquarkus.profile=dev,mongodb-diagnostics.
# Both injected client styles are owned by Quarkus; no automatic Mongo container or index creation.
quarkus.http.host=127.0.0.1
quarkus.mongodb.connection-string=${BOOTUI_SAMPLE_MONGODB_URL}
quarkus.mongodb.database=bootui_sample
quarkus.mongodb.application-name=bootui-quarkus-mongodb-sample
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.health.enabled=false
quarkus.mongodb.min-pool-size=0
quarkus.mongodb.max-pool-size=4
quarkus.mongodb.server-selection-timeout=2S
quarkus.mongodb.connect-timeout=2S
quarkus.mongodb.read-timeout=2S
bootui.mongodb.authorized-database-enumeration-enabled=false

# Reuse the sample's existing H2 capability instead of starting PostgreSQL or Ollama.
quarkus.datasource.db-kind=h2
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:h2:mem:bootui_mongodb_sample;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.otel.exporter.otlp.enabled=false
quarkus.log.category."org.mongodb.driver.client".level=WARN
