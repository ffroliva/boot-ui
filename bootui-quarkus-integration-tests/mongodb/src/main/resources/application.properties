quarkus.application.name=bootui-quarkus-mongodb-it
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.health.enabled=false
quarkus.mongodb.metrics.enabled=false
quarkus.mongodb.tracing.enabled=false
quarkus.mongodb.force-default-clients=false
quarkus.mongodb.connection-string=mongodb://127.0.0.1:1
quarkus.mongodb.database=fixture_catalog
quarkus.mongodb."unused".connection-string=mongodb://127.0.0.1:1
quarkus.mongodb."unused".database=fixture_catalog
quarkus.mongodb."inactive".active=false
quarkus.mongodb."inactive".database=fixture_catalog
bootui.expose-values=MASKED
